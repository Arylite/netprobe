openapi: 3.0.3
info:
  title: netprobe UI API
  version: 0.7.0
  description: >
    The API of the netprobe central for a web UI, or any client. Sign in with
    POST /api/v1/login, then send the token as "Authorization: Bearer TOKEN".
    There are no cookies. A browser on another origin must be listed in the
    central's --cors-origins.
servers:
  - url: http://127.0.0.1:8081
security:
  - bearer: []
paths:
  /api/v1/openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document.
  /api/v1/login:
    post:
      summary: Sign in
      description: Every failure answers the same 401. Failed attempts are throttled per address and per account and address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: A session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/logout:
    post:
      summary: End the current session
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      summary: The signed-in user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/password:
    post:
      summary: Change your password
      description: Needs the current password. Ends every session of the account, this one included.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The current password is wrong. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/edges:
    get:
      summary: List the edges
      description: Revoked edges are listed too. last_seen is when the edge last reported.
      responses:
        "200":
          description: The edges.
          content:
            application/json:
              schema:
                type: object
                required: [edges]
                properties:
                  edges:
                    type: array
                    items: { $ref: "#/components/schemas/Edge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Register an edge (administrator)
      description: The token is returned once and cannot be shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "1 to 63 lowercase letters, digits or dashes." }
      responses:
        "201":
          description: The edge and its token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedEdge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/edges/{name}:
    delete:
      summary: Revoke an edge (administrator)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/checks:
    get:
      summary: List the checks
      responses:
        "200":
          description: The checks.
          content:
            application/json:
              schema:
                type: object
                required: [checks]
                properties:
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/Check" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Add a check (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Check" }
      responses:
        "201":
          description: The check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/checks/{id}:
    delete:
      summary: Remove a check (administrator)
      description: Its results are kept.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/checks/{id}/results:
    get:
      summary: The latest results of a check, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Result" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users:
    get:
      summary: List the accounts (administrator)
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create an account (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewUser" }
      responses:
        "201":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/users/{username}:
    delete:
      summary: Delete an account (administrator)
      description: Not your own account, and never the last administrator (409).
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/status:
    get:
      summary: How every check does, on each edge, over the last day
      description: >
        For each check, one row per active edge that reported in the window: its
        latest result, how many runs there were, the share that succeeded and the
        95th percentile of the round-trip time of the successful ones.
      responses:
        "200":
          description: The checks with their rows.
          content:
            application/json:
              schema:
                type: object
                required: [window_seconds, checks]
                properties:
                  window_seconds: { type: integer }
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/CheckStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/incidents:
    get:
      summary: The latest incidents, newest first
      description: >
        An incident opens when a check keeps failing on an edge, or when an edge
        stops reporting, and resolves when it recovers.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [all, open], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: The incidents.
          content:
            application/json:
              schema:
                type: object
                required: [incidents]
                properties:
                  incidents:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/channels:
    get:
      summary: List the notification channels (administrator)
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Add a notification channel (administrator)
      description: >
        A webhook that receives a JSON POST when an incident opens or resolves. A
        channel only hears of incidents that start after it was added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChannel" }
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/channels/{name}:
    delete:
      summary: Remove a notification channel (administrator)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/channels/{name}/test:
    post:
      summary: Send a test notification to a channel (administrator)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: The channel accepted it. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The channel did not accept it; the message says why.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: The request is malformed or invalid.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: No valid session.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The account is not an administrator.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such thing.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: It already exists, or the change is not allowed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Too many failed attempts; see Retry-After.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 128 }
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string, description: "Send as a bearer token." }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
    NewUser:
      type: object
      required: [username, role, password]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        password: { type: string, minLength: 12, maxLength: 128 }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 128 }
    Edge:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
    CreatedEdge:
      type: object
      required: [id, name, token]
      properties:
        id: { type: string }
        name: { type: string }
        token: { type: string, description: "Shown once." }
    Check:
      type: object
      required: [id, kind, target, interval_seconds]
      properties:
        id: { type: string }
        kind: { type: string, enum: [tcp, http] }
        target: { type: string, description: "host:port for tcp, a URL for http." }
        interval_seconds: { type: integer, minimum: 1 }
    Result:
      type: object
      required: [edge_id, at, ok, rtt_millis]
      properties:
        edge_id: { type: string }
        at: { type: string, format: date-time }
        ok: { type: boolean }
        rtt_millis: { type: number }
        error: { type: string }
    CheckStatus:
      type: object
      required: [id, kind, target, interval_seconds, edges]
      properties:
        id: { type: string }
        kind: { type: string, enum: [tcp, http] }
        target: { type: string }
        interval_seconds: { type: integer }
        edges:
          type: array
          items: { $ref: "#/components/schemas/EdgeStatus" }
    EdgeStatus:
      type: object
      required: [edge_id, edge, last_at, ok, rtt_millis, samples, success_ratio]
      properties:
        edge_id: { type: string }
        edge: { type: string, description: "Name of the edge." }
        last_at: { type: string, format: date-time }
        ok: { type: boolean, description: "Whether the latest run succeeded." }
        rtt_millis: { type: number, description: "Round-trip time of the latest run." }
        error: { type: string }
        samples: { type: integer, description: "Runs in the window." }
        success_ratio: { type: number, minimum: 0, maximum: 1 }
        p95_rtt_millis: { type: number, description: "Absent when no run succeeded." }
    Incident:
      type: object
      required: [id, kind, edge_id, edge, started_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [check, edge], description: "A check that keeps failing on an edge, or an edge that stopped reporting." }
        check_id: { type: string, description: "Absent for an edge incident." }
        edge_id: { type: string }
        edge: { type: string, description: "Name of the edge." }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, description: "Absent while it is going on." }
        detail: { type: string }
        resolution: { type: string, description: "recovered, edge revoked or check removed." }
    Channel:
      type: object
      required: [name, url, has_secret, created_at]
      properties:
        name: { type: string }
        url: { type: string }
        has_secret: { type: boolean, description: "A secret signs what is sent; it is never returned." }
        created_at: { type: string, format: date-time }
    NewChannel:
      type: object
      required: [name, url]
      properties:
        name: { type: string, description: "1 to 63 lowercase letters, digits or dashes." }
        url: { type: string, description: "An http:// or https:// address, without credentials." }
        secret:
          type: string
          maxLength: 256
          description: >
            Signs each notification: X-Netprobe-Signature is sha256= and the hex
            HMAC-SHA256 of X-Netprobe-Timestamp, a dot and the body.
