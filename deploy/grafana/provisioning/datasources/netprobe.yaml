apiVersion: 1

datasources:
  - name: netprobe
    uid: netprobe
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana
    isDefault: true
    editable: false
    jsonData:
      database: netprobe
      # The database is on a network of its own, with no way out.
      sslmode: disable
      postgresVersion: 1800
      timescaledb: true
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timeInterval: 10s
    secureJsonData:
      password: $__file{/grafana-secrets/grafana_db_password}
