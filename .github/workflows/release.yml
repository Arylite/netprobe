name: Release

# A tag vX.Y.Z on main publishes a GitHub release with the binaries of every
# platform, their checksums and an attestation of where they were built.
#
#   lint ---+
#   test ---+--> build --+
#   vuln ---+            +--> package --> publish
#   web  ----------------+

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  vuln:
    uses: ./.github/workflows/vuln.yml

  web:
    uses: ./.github/workflows/web.yml

  build:
    needs: [lint, test, vuln]
    uses: ./.github/workflows/build.yml

  package:
    needs: [build, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # to sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: netprobe-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui
          path: webui
      - name: Archives and checksums
        run: |
          mkdir dist
          for dir in artifacts/netprobe-*; do
            platform="${dir#artifacts/netprobe-}"
            stage="netprobe_${GITHUB_REF_NAME}_${platform}"
            mkdir "$stage"
            cp "$dir"/* LICENSE README.md "$stage"/
            case "$platform" in
              windows-*) zip -qr "dist/$stage.zip" "$stage" ;;
              *) chmod +x "$stage"/netprobe-*; tar -czf "dist/$stage.tar.gz" "$stage" ;;
            esac
            rm -rf "$stage"
          done
          # The UI is static files: one archive for every platform, to put on any web server.
          stage="netprobe-ui_${GITHUB_REF_NAME}"
          mkdir "$stage"
          cp -r webui/. "$stage"/
          cp LICENSE "$stage"/
          tar -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "$stage"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" $prerelease
