name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: timescale/timescaledb:2.30.1-pg18
        env:
          POSTGRES_USER: netprobe
          POSTGRES_PASSWORD: netprobe
          POSTGRES_DB: netprobe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netprobe"
          --health-interval 5s
          --health-retries 20
    env:
      NETPROBE_TEST_DATABASE_URL: postgres://netprobe:netprobe@localhost:5432/netprobe?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests with the race detector, against TimescaleDB
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
