name: CI

# What runs, and in which order. The work itself lives in the reusable
# workflows next to this file.
#
#   lint ---+
#   test ---+--> build --+
#   vuln ---+            +--> ci (the one check to require)
#   web  ----------------+
#   images ---------------+

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  vuln:
    uses: ./.github/workflows/vuln.yml

  web:
    uses: ./.github/workflows/web.yml

  images:
    uses: ./.github/workflows/images.yml

  build:
    needs: [lint, test]
    uses: ./.github/workflows/build.yml

  ci:
    name: ci
    if: always()
    needs: [lint, test, vuln, web, images, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Every stage passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;; esac
