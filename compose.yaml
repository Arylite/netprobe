# netprobe: the central, its database, the web UI and a TLS proxy in front.
#
#   docker compose up -d
#   printf '%s\n' 'a long admin password' | docker compose exec -T central /netprobe-central user add --username admin --role admin
#
# Only the proxy listens on the host. The database is on a network of its own,
# with no way out, and every container runs without privileges on a read-only
# file system.
#
# To publish it through a Cloudflare Tunnel instead of open ports, see the
# cloudflared service below.

name: netprobe

x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  # Makes the database password and the URL the central connects with, once.
  init:
    <<: *hardened
    restart: "no"
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    volumes: [secrets:/secrets]
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        [ -s /secrets/db_password ] || head -c 32 /dev/urandom | base64 | tr -d '/+=\n' > /secrets/db_password
        [ -s /secrets/database_url ] || printf 'postgres://netprobe:%s@db:5432/netprobe?sslmode=disable' "$$(cat /secrets/db_password)" > /secrets/database_url
        [ -s /secrets/secret_key ] || head -c 32 /dev/urandom | base64 > /secrets/secret_key
        chmod 444 /secrets/db_password /secrets/database_url /secrets/secret_key
    networks: [backend]

  db:
    <<: *hardened
    build: {context: deploy/db}
    image: ghcr.io/arylite/netprobe-db:${NETPROBE_VERSION:-latest}
    environment:
      POSTGRES_USER: netprobe
      POSTGRES_DB: netprobe
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - db-data:/var/lib/postgresql
      - secrets:/secrets:ro
    tmpfs: [/tmp, /var/run/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netprobe -d netprobe"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    networks: [backend]
    depends_on:
      init: {condition: service_completed_successfully}

  central:
    <<: *hardened
    build: {context: ., target: central, args: {VERSION: "${NETPROBE_VERSION:-dev}"}}
    image: ghcr.io/arylite/netprobe-central:${NETPROBE_VERSION:-latest}
    environment:
      NETPROBE_DATABASE_URL_FILE: /secrets/database_url
      NETPROBE_SECRET_KEY_FILE: /secrets/secret_key
      # Only the proxy and cloudflared reach the central, and they say who the client is.
      NETPROBE_TRUSTED_PROXIES: 172.28.0.10,172.28.0.11
      NETPROBE_RETENTION: ${NETPROBE_RETENTION:-2160h}
      NETPROBE_LOG_LEVEL: ${NETPROBE_LOG_LEVEL:-info}
    volumes: [secrets:/secrets:ro]
    mem_limit: 512m
    networks: [backend, frontend]
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *hardened
    build: {context: ., target: web}
    image: ghcr.io/arylite/netprobe-web:${NETPROBE_VERSION:-latest}
    environment:
      NETPROBE_API_URL: ${NETPROBE_PUBLIC_URL:-https://localhost}
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    # The entrypoint writes the configuration from the template, as nginx (101).
    tmpfs: [/tmp, "/etc/nginx/conf.d:uid=101,gid=101"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
    mem_limit: 64m
    networks: [frontend]

  proxy:
    <<: *hardened
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    cap_add: [NET_BIND_SERVICE]
    environment:
      NETPROBE_DOMAIN: ${NETPROBE_DOMAIN:-localhost}
    ports:
      - "${NETPROBE_BIND:-0.0.0.0}:${NETPROBE_HTTP_PORT:-80}:80"
      - "${NETPROBE_BIND:-0.0.0.0}:${NETPROBE_HTTPS_PORT:-443}:443"
      - "${NETPROBE_BIND:-0.0.0.0}:${NETPROBE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
    mem_limit: 128m
    networks:
      frontend:
        ipv4_address: 172.28.0.10
    depends_on: [central, web]

  # Optional: the UI and the edge API through a Cloudflare Tunnel, which needs no
  # open port. In the Cloudflare dashboard, create a tunnel, give it the public
  # hostname of NETPROBE_PUBLIC_URL with the service http://proxy:8088, and keep
  # its token in the file ./cloudflared_token. Then:
  #   NETPROBE_BIND=127.0.0.1 docker compose --profile cloudflared up -d
  cloudflared:
    <<: *hardened
    profiles: [cloudflared]
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared_token
      TUNNEL_METRICS: 127.0.0.1:2000
    secrets: [cloudflared_token]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    mem_limit: 128m
    networks:
      frontend:
        ipv4_address: 172.28.0.11
    depends_on: [proxy]

networks:
  # The database can talk to the central and to nothing else.
  backend:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24

secrets:
  cloudflared_token:
    file: ./cloudflared_token

volumes:
  db-data:
  secrets:
  caddy-data:
  caddy-config:
