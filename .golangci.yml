version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # Terminal output, and closing what was only read.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.ReadCloser).Close
        - (net.Conn).Close
        - (net.PacketConn).Close
        - (*database/sql.DB).Close
    gosec:
      excludes:
        # Table names in SQL come from constants, never from input.
        - G201
        # Integer conversions of values already bounded by validation.
        - G115
        # Files at paths set by the operator (flags, config, environment).
        - G304
        - G703
        # math/rand for jitter and start offsets, never for secrets.
        - G404
    revive:
      rules:
        - name: package-comments
        - name: exported
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    generated: strict
    rules:
      # Tests may ignore errors of their setup calls.
      - path: _test\.go
        linters: [errcheck, gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Arylite/netprobe
